<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>COMBO-UI Editor</title>
        <style>
            #splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #6f4b65;
                transition: opacity 0.6s ease;
            }
            #splash.fade-out {
                opacity: 0;
                pointer-events: none;
            }
            #splash img {
                max-width: 90%;
                max-height: 90%;
                object-fit: contain;
            }
        </style>
    </head>

    <body>
        <div id="app"></div>
        <div id="splash">
            <img src="/splash.png" alt="COMBO-UI Editor" />
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
